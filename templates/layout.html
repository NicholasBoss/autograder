<html lang="en">

    <meta charset="utf-8" />

    <title>AutoMark</title>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample" aria-controls="navbarsExample" aria-expanded="false" aria-label="Toggle navigation">

            <li class="nav-item"><a class="nav-link" href="/students" data-path="/students">Students</a></li>
            <li class="nav-item"><a class="nav-link" href="/questions" data-path="/questions">Questions</a></li>
            <li class="nav-item"><a class="nav-link" href="/performance" data-path="/performance">Performance</a></li>
            <li class="nav-item"><a class="nav-link" href="/grades" data-path="/grades">Grades</a></li>

          </span>
        </div>
      </div>
    </nav>
    <main class="container my-4">
      {% if message %}
      <div class="alert alert-info">{{ message }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Theme toggle functionality
      (function(){
        const themeToggle = document.getElementById('themeToggle');
        const moonIcon = document.getElementById('moonIcon');
        const sunIcon = document.getElementById('sunIcon');
        const html = document.documentElement;
        
        // Load saved theme or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        updateIcons(savedTheme);
        
        themeToggle.addEventListener('click', () => {
          const currentTheme = html.getAttribute('data-theme');
          const newTheme = currentTheme === 'light' ? 'dark' : 'light';
          html.setAttribute('data-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          updateIcons(newTheme);
        });
        
        function updateIcons(theme) {
          if (theme === 'dark') {
            moonIcon.style.display = 'none';
            sunIcon.style.display = 'block';
          } else {
            moonIcon.style.display = 'block';
            sunIcon.style.display = 'none';
          }
        }
      })();

      // Navigation active link highlighting
      (function(){
        const path = location.pathname.replace(/\/$/,'') || '/';
        document.querySelectorAll('#navTabs .nav-link').forEach(a=>{
          const p = a.getAttribute('data-path');
          if (p === path || (p!== '/' && path.startsWith(p))) {
            a.classList.add('active');
          }
        });
      })();
    </script>
  </body>
  </html>
