{% extends "layout.html" %}
{% block content %}
<h2>Questions Analysis</h2>

<div class="mb-4">
  <div class="row">
    <div class="col-md-6">
      <label for="courseSelect" class="form-label">Select Course:</label>
      <select id="courseSelect" class="form-control">
        <option value="">Loading courses...</option>
      </select>
      <input type="hidden" id="courseId" />
    </div>
    <div class="col-md-6">
      <label for="assignmentSelect" class="form-label">Select Assignment:</label>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="fileUploadsOnly" checked>
        <label class="form-check-label" for="fileUploadsOnly">
          Show only assignments with parsed questions
        </label>
      </div>
      <select id="assignmentSelect" class="form-control">
        <option value="">Select a course first...</option>
      </select>
      <input type="hidden" id="assignmentId" />
    </div>
  </div>
  <div class="mt-3">
    <button id="loadQuestionsBtn" class="btn btn-primary" onclick="loadParsedQuestions()" disabled>Load Parsed Questions</button>
    <button id="compareSubmissionsBtn" class="btn btn-success ms-2" onclick="compareSubmissions()" disabled>Compare All Submissions</button>
  </div>
</div>

<div id="status" class="mb-4"></div>

<div id="questionsContainer" style="display: none;">
  <div class="card">
    <div class="card-header">
      <h4>Parsed Questions</h4>
      <small class="text-muted">These questions will be used for comparison with student submissions</small>
    </div>
    <div class="card-body">
      <div id="questionsContent"></div>
    </div>
  </div>
</div>

<div id="comparisonResults" class="mt-4" style="display: none;">
  <h4>Comparison Results</h4>
  <div id="comparisonContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
let currentAssignmentId = '';
let currentCourseId = '';

// Load courses from existing folders
async function loadCoursesFromFolders() {
  const sel = document.getElementById('courseSelect');
  sel.innerHTML = '<option value="">Loading courses...</option>';
  
  try {
    const response = await fetch('/api/available-courses');
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    
    const data = await response.json();
    sel.innerHTML = '<option value="">Select a course...</option>';
    
    if (!data.courses || data.courses.length === 0) {
      sel.innerHTML = '<option value="">No courses with assignments found</option>';
    } else {
      data.courses.forEach(course => {
        const opt = document.createElement('option');
        opt.value = course.course_id;
        opt.textContent = `Course ${course.course_id} (${course.assignment_count} assignments)`;
        sel.appendChild(opt);
      });
    }
  } catch (error) {
    console.error('Error loading courses:', error);
    sel.innerHTML = '<option value="">Error loading courses</option>';
  }
}

// Load assignments with parsed questions for selected course
async function loadAssignmentsWithQuestions() {
  const courseId = document.getElementById('courseSelect').value;
  const sel = document.getElementById('assignmentSelect');
  const loadBtn = document.getElementById('loadQuestionsBtn');
  
  document.getElementById('courseId').value = courseId;
  
  if (!courseId) {
    sel.innerHTML = '<option value="">Select a course first...</option>';
    loadBtn.disabled = true;
    return;
  }
  
  sel.innerHTML = '<option value="">Loading assignments...</option>';
  sel.disabled = true;
  
  try {
    const response = await fetch(`/api/course-assignments-with-questions/${courseId}`);
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    
    const data = await response.json();
    sel.innerHTML = '';
    
    if (!data.assignments || data.assignments.length === 0) {
      sel.innerHTML = '<option value="">No assignments with parsed questions found</option>';
      loadBtn.disabled = true;
    } else {
      sel.innerHTML = '<option value="">Select an assignment...</option>';
      data.assignments.forEach(assignment => {
        const opt = document.createElement('option');
        opt.value = assignment.assignment_id;
        opt.textContent = `Assignment ${assignment.assignment_id} (${assignment.has_questions ? '✅ Questions' : '❌ No Questions'})`;
        sel.appendChild(opt);
      });
      loadBtn.disabled = false;
    }
    
    sel.disabled = false;
    
  } catch (error) {
    console.error('Error loading assignments:', error);
    sel.innerHTML = '<option value="">Error loading assignments</option>';
    sel.disabled = false;
    loadBtn.disabled = true;
  }
}

function onCourseChange() {
  currentCourseId = document.getElementById('courseSelect').value;
  document.getElementById('assignmentSelect').value = '';
  document.getElementById('assignmentId').value = '';
  document.getElementById('loadQuestionsBtn').disabled = true;
  document.getElementById('compareSubmissionsBtn').disabled = true;
  
  if (currentCourseId) {
    loadAssignmentsWithQuestions();
  }
}

function onAssignmentChange() {
  const assignmentId = document.getElementById('assignmentSelect').value;
  document.getElementById('assignmentId').value = assignmentId;
  
  if (assignmentId) {
    document.getElementById('loadQuestionsBtn').disabled = false;
  } else {
    document.getElementById('loadQuestionsBtn').disabled = true;
    document.getElementById('compareSubmissionsBtn').disabled = true;
  }
}

async function loadParsedQuestions() {
  const courseId = document.getElementById('courseId').value.trim();
  const assignmentId = document.getElementById('assignmentId').value.trim();
  const statusDiv = document.getElementById('status');
  const questionsContainer = document.getElementById('questionsContainer');
  const compareBtn = document.getElementById('compareSubmissionsBtn');
  
  if (!assignmentId || !courseId) {
    statusDiv.innerHTML = '<div class="alert alert-warning">Please select both course and assignment</div>';
    return;
  }
  
  currentAssignmentId = assignmentId;
  currentCourseId = courseId;
  statusDiv.innerHTML = '<div class="alert alert-info">⏳ Loading parsed questions...</div>';
  
  try {
    const response = await fetch(`/api/parsed-questions/${courseId}/${assignmentId}`);
    const data = await response.json();
    
    if (response.ok && data.success) {
      // Render markdown content
      const questionsContent = document.getElementById('questionsContent');
      questionsContent.innerHTML = marked.marked(data.content);
      
      questionsContainer.style.display = 'block';
      compareBtn.disabled = false;
      
      statusDiv.innerHTML = `
        <div class="alert alert-success">
          ✅ Loaded parsed questions for Course ${courseId}, Assignment ${assignmentId}
          <br><small>Questions are displayed in markdown format below</small>
        </div>
      `;
    } else {
      statusDiv.innerHTML = `
        <div class="alert alert-danger">
          ❌ ${data.error}
          <br><small>Make sure you have uploaded and parsed an answer key for this assignment</small>
        </div>
      `;
      questionsContainer.style.display = 'none';
      compareBtn.disabled = true;
    }
  } catch (error) {
    console.error('Error loading parsed questions:', error);
    statusDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${error.message}</div>`;
    questionsContainer.style.display = 'none';
    compareBtn.disabled = true;
  }
}

async function compareSubmissions() {
  if (!currentAssignmentId || !currentCourseId) {
    document.getElementById('status').innerHTML = '<div class="alert alert-warning">Please load questions first</div>';
    return;
  }
  
  const statusDiv = document.getElementById('status');
  const resultsDiv = document.getElementById('comparisonResults');
  const compareBtn = document.getElementById('compareSubmissionsBtn');
  
  compareBtn.disabled = true;
  compareBtn.textContent = 'Comparing...';
  statusDiv.innerHTML = '<div class="alert alert-info">⏳ Comparing all student submissions to parsed questions...</div>';
  
  try {
    const response = await fetch('/api/compare-submissions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        assignment_id: currentAssignmentId,
        course_id: currentCourseId 
      })
    });
    
    const data = await response.json();
    
    if (response.ok) {
      statusDiv.innerHTML = `
        <div class="alert alert-success">
          ✅ Comparison complete! 
          <br>Analyzed ${data.total_students} students
          <br>Successfully graded: ${data.successfully_graded}
          <br>Average score: ${data.average_score}%
          <br>Processing time: ${data.processing_time_seconds}s
        </div>
      `;
      
      // Display results table
      displayComparisonResults(data.comparison_results);
      resultsDiv.style.display = 'block';
      
    } else {
      statusDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${data.error}</div>`;
    }
  } catch (error) {
    console.error('Error comparing submissions:', error);
    statusDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${error.message}</div>`;
  } finally {
    compareBtn.disabled = false;
    compareBtn.textContent = 'Compare All Submissions';
  }
}

function displayComparisonResults(results) {
  const contentDiv = document.getElementById('comparisonContent');
  
  let html = `
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>User ID</th>
            <th>Score</th>
            <th>Status</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody>
  `;
  
  results.forEach((result, index) => {
    const score = result.score !== undefined ? result.score : (result.score_percentage !== undefined ? result.score_percentage : 0);
    const scoreClass = score >= 80 ? 'text-success' : 
                      score >= 60 ? 'text-warning' : 'text-danger';
    const status = result.error ? `<span class="badge bg-danger">Error</span>` : `<span class="badge bg-success">Graded</span>`;
    
    html += `
      <tr>
        <td>${result.user_id} (${result.user_name})</td>
        <td><span class="${scoreClass} fw-bold">${score}%</span></td>
        <td>${status}</td>
        <td>
          <button class="btn btn-sm btn-outline-info" onclick="showFeedbackDetails(${index})">
            View Feedback
          </button>
        </td>
      </tr>
    `;
  });
  
  html += `
        </tbody>
      </table>
    </div>
    
    <div id="feedbackDetails" class="mt-4" style="display: none;">
      <div class="card">
        <div class="card-header">
          <h5>Student Feedback</h5>
        </div>
        <div class="card-body" id="feedbackDetailsContent">
        </div>
      </div>
    </div>
  `;
  
  contentDiv.innerHTML = html;
  
  // Store results for detail view
  window.comparisonResults = results;
}

function showFeedbackDetails(studentIndex) {
  const result = window.comparisonResults[studentIndex];
  const detailsDiv = document.getElementById('feedbackDetails');
  const contentDiv = document.getElementById('feedbackDetailsContent');
  
  const score = result.score !== undefined ? result.score : (result.score_percentage !== undefined ? result.score_percentage : 0);
  const scoreClass = score >= 80 ? 'bg-success' : score >= 60 ? 'bg-warning' : 'bg-danger';
  
  let html = `
    <div class="mb-3">
      <h6>${result.user_id} - ${result.user_name}</h6>
      <div class="badge ${scoreClass} fs-6">Score: ${score}%</div>
    </div>
  `;
  
  if (result.error) {
    html += `
      <div class="alert alert-danger">
        <strong>Error:</strong> ${result.error}
      </div>
    `;
  } else {
    html += `
      <div class="card mb-3">
        <div class="card-header bg-info">
          <strong>OpenRouter Feedback</strong>
        </div>
        <div class="card-body">
          <p>${result.feedback || 'No feedback provided'}</p>
        </div>
      </div>
    `;
    
    if (result.full_response) {
      html += `
        <details class="mt-3">
          <summary class="cursor-pointer">View Full LLM Response</summary>
          <div class="bg-light p-3 mt-2 border rounded" style="white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; max-height: 400px; overflow-y: auto;">
            ${result.full_response.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
          </div>
        </details>
      `;
    }
  }
  
  contentDiv.innerHTML = html;
  detailsDiv.style.display = 'block';
  
  // Scroll to details
  detailsDiv.scrollIntoView({ behavior: 'smooth' });
}

// Event listeners
document.getElementById('courseSelect').addEventListener('change', onCourseChange);
document.getElementById('assignmentSelect').addEventListener('change', onAssignmentChange);

// Load courses on page load
document.addEventListener('DOMContentLoaded', function() {
  loadCoursesFromFolders();
});
</script>

{% endblock %}
