{% extends 'layout.html' %}
{% block content %}
<h3>Performance</h3>
<div class="row g-3">
  <div class="col-md-6"><div class="card"><div class="card-body"><canvas id="lineA" height="120"></canvas></div></div></div>
  <div class="col-md-6"><div class="card"><div class="card-body"><canvas id="histA" height="120"></canvas></div></div></div>
  </div>

<script>
async function loadPerf(){
  const assigns = await (await fetch('/api/stats/assignments')).json();
  const labels = assigns.map(a=>a.assignment_id);
  const avgs = assigns.map(a=>a.avg||0);
  new Chart(document.getElementById('lineA'), {type:'line', data:{labels, datasets:[{label:'Assignment Avg', data:avgs}]}});
  new Chart(document.getElementById('histA'), {type:'bar', data:{labels, datasets:[{label:'Assignment Avg', data:avgs}]}});
}
loadPerf();
</script>
{% endblock %}
